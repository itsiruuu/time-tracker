<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="stopwatch-container">
        <h1>Stopwatch</h1>
        <h1 id="counter">00:00:00</h1>

        <div class="buttons">
            <button class="btn start" onclick="startTimer()">Start</button>
            <button class="btn stop" onclick="stopTimer()">Stop</button>
            <button class="btn reset" onclick="resetTimer()">Reset</button>
        </div>
    </div>
<br><br><br><br><br>
    <!-- Counter Up -->
    <div class="counter-container">
        <h1>Counter up :</h1>
        <h1 class="counter" data-number="100">0</h1>
        <h1 class="counter" data-number="1000">0</h1>
        <h1 class="counter" data-number="500"></h1>
    </div>

    <script src="script.js"></script>
</body>
</html>
